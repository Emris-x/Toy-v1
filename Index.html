
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TOY — a playful learning world powered by curiosity."
    >

    <title>TOY</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <!--
        TOY APPLICATION
        =================
        Main application container.
    -->

    <div id="app">

        <!--
            SCREEN CONTAINER
            ----------------
            Every major TOY screen will eventually
            live inside this container.
        -->

        <main id="screen">

            <!-- Temporary foundation screen -->
            <section id="boot-screen" class="screen">

                <div class="boot-content">

                    <div class="logo-placeholder">
                        TOY
                    </div>

                    <h1>Welcome to TOY</h1>

                    <p>
                        A little world for big discoveries.
                    </p>

                    <button
                        id="start-button"
                        type="button"
                    >
                        Start
                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- Main JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
